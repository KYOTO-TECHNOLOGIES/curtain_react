document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-violet-700: #4338c4;\n  --violet-ink: #2d2a6e;\n\n  --bg: #f4f4f8;\n  --card: #ffffff;\n  --ink: #16162a;\n  --ink-2: #3b3b50;\n  --muted: #8b8b9c;\n  --muted-2: #a6a6b6;\n  --border: #ececf2;\n  --border-2: #f1f1f6;\n\n  --green: #1f9d5a;\n  --green-bg: #e4f5ea;\n  --orange: #e8954a;\n  --orange-bg: #fcefdf;\n  --red: #e5484d;\n  --red-bg: #fde7e7;\n  --violet-soft: #ecebfb;\n  --blue: #3b7be0;\n  --blue-bg: #e7effb;\n\n  --radius-lg: 20px;\n  --radius-md: 16px;\n  --radius-sm: 12px;\n  --shadow-card: 0 1px 2px rgba(20,20,42,.04), 0 6px 24px rgba(20,20,42,.05);\n  --shadow-pop: 0 8px 30px rgba(20,20,42,.10);\n  --sidebar-w: 252px;\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nbody {\n  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;\n  background: var(--bg);\n  color: var(--ink);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\na { color: inherit; text-decoration: none; }\nbutton { font-family: inherit; cursor: pointer; border: none; background: none; }\nsvg { display: block; }\n\n.app { display: flex; min-height: 100vh; }\n\n/* ===== Sidebar ===== */\n.sidebar {\n  width: var(--sidebar-w);\n  flex: 0 0 var(--sidebar-w);\n  background: var(--violet);\n  color: #fff;\n  display: flex;\n  flex-direction: column;\n  padding: 28px 20px 24px;\n  position: sticky;\n  top: 0;\n  height: 100vh;\n}\n.brand { padding: 0 8px 26px; }\n.brand h1 {\n  font-size: 23px; font-weight: 800; letter-spacing: -.5px; margin: 0;\n}\n.brand span {\n  display: block; margin-top: 4px;\n  font-size: 10px; font-weight: 700; letter-spacing: 2px;\n  color: rgba(255,255,255,.55);\n}\n.nav { display: flex; flex-direction: column; gap: 4px; }\n.nav-label {\n  font-size: 10px; font-weight: 700; letter-spacing: 1.6px;\n  color: rgba(255,255,255,.45); padding: 18px 12px 8px;\n}\n.nav-item {\n  display: flex; align-items: center; gap: 13px;\n  padding: 11px 14px; border-radius: 12px;\n  color: rgba(255,255,255,.82); font-size: 14.5px; font-weight: 600;\n  width: 100%; text-align: left; transition: background .15s, color .15s;\n}\n.nav-item svg { width: 19px; height: 19px; flex: 0 0 19px; stroke-width: 2; }\n.nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }\n.nav-item.active { background: rgba(255,255,255,.16); color: #fff; font-weight: 700; }\n\n.sidebar-foot { margin-top: auto; padding-top: 20px; }\n.btn-new {\n  width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px;\n  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18);\n  color: #fff; font-weight: 700; font-size: 14.5px;\n  padding: 14px; border-radius: 14px; transition: background .15s;\n}\n.btn-new:hover { background: rgba(255,255,255,.24); }\n.btn-new svg { width: 18px; height: 18px; }\n\n/* ===== Main ===== */\n.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }\n\n.topbar {\n  height: 78px; flex: 0 0 78px;\n  background: #fff; border-bottom: 1px solid var(--border);\n  display: flex; align-items: center; gap: 22px;\n  padding: 0 34px; position: sticky; top: 0; z-index: 20;\n}\n.search {\n  flex: 0 1 380px; display: flex; align-items: center; gap: 11px;\n  background: #f4f4f8; border-radius: 999px; padding: 12px 18px;\n  color: var(--muted);\n}\n.search svg { width: 18px; height: 18px; flex: 0 0 18px; }\n.search input {\n  border: none; background: none; outline: none; flex: 1;\n  font-family: inherit; font-size: 14px; color: var(--ink);\n}\n.search input::placeholder { color: var(--muted-2); }\n.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 20px; }\n.icon-btn {\n  width: 40px; height: 40px; border-radius: 50%;\n  display: grid; place-items: center; color: var(--ink-2);\n  transition: background .15s;\n}\n.icon-btn:hover { background: #f4f4f8; }\n.icon-btn svg { width: 21px; height: 21px; }\n.topbar-sep { width: 1px; height: 30px; background: var(--border); }\n.user { display: flex; align-items: center; gap: 12px; }\n.user-meta { text-align: right; line-height: 1.25; }\n.user-meta b { font-size: 14px; font-weight: 700; color: var(--ink); }\n.user-meta small { font-size: 11.5px; color: var(--muted); }\n.avatar {\n  width: 42px; height: 42px; border-radius: 50%;\n  display: grid; place-items: center; font-weight: 700; font-size: 15px;\n  background: linear-gradient(135deg, #6b5fff, #8a7dff); color: #fff;\n  border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border);\n}\n\n/* ===== Page ===== */\n.page { padding: 36px 34px 48px; display: none; }\n.page.active { display: block; }\n\n.page-head { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 28px; }\n.page-head h2 { margin: 0; font-size: 33px; font-weight: 800; letter-spacing: -.8px; white-space: nowrap; }\n.page-head > div { min-width: 0; }\n.page-head .actions { flex: 0 0 auto; }\n.page-head p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }\n.page-head .actions { margin-left: auto; display: flex; gap: 12px; }\n.btn {\n  display: inline-flex; align-items: center; gap: 9px;\n  padding: 13px 20px; border-radius: 12px; font-weight: 700; font-size: 14px;\n  transition: all .15s; white-space: nowrap;\n}\n.btn svg { width: 17px; height: 17px; }\n.btn-ghost { background: #fff; border: 1px solid var(--border); color: var(--ink-2); box-shadow: var(--shadow-card); }\n.btn-ghost:hover { border-color: #dadae3; }\n.btn-primary { background: var(--violet); color: #fff; box-shadow: 0 6px 18px rgba(91,79,232,.32); }\n.btn-primary:hover { background: var(--violet-600); }\n\n/* ===== Cards ===== */\n.card {\n  background: var(--card); border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-card); border: 1px solid #f0f0f5;\n}\n\n/* stat cards */\n.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-bottom: 24px; }\n.stat {\n  background: #fff; border-radius: var(--radius-md); padding: 22px 24px 24px;\n  box-shadow: var(--shadow-card); border: 1px solid #f0f0f5;\n}\n.stat-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 26px; }\n.stat-icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; }\n.stat-icon svg { width: 23px; height: 23px; }\n.tint-green { background: var(--green-bg); color: var(--green); }\n.tint-orange { background: var(--orange-bg); color: var(--orange); }\n.tint-violet { background: var(--violet-soft); color: var(--violet); }\n.tint-red { background: var(--red-bg); color: var(--red); }\n.tint-blue { background: var(--blue-bg); color: var(--blue); }\n.stat-badge { font-size: 11px; font-weight: 800; letter-spacing: .4px; text-align: right; line-height: 1.3; }\n.badge-up { color: var(--green); display: inline-flex; align-items: center; gap: 3px; }\n.badge-up svg { width: 13px; height: 13px; }\n.badge-muted { color: var(--muted); }\n.badge-red { color: var(--red); }\n.stat-label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }\n.stat-value { margin-top: 8px; font-size: 27px; font-weight: 800; letter-spacing: -.5px; line-height: 1.15; }\n.stat-value .cur { font-size: 19px; font-weight: 700; color: var(--ink-2); }\n\n/* main grid */\n.grid-2 { display: grid; grid-template-columns: 1.78fr 1fr; gap: 24px; align-items: start; margin-bottom: 24px; }\n.col { display: flex; flex-direction: column; gap: 24px; }\n\n/* card header */\n.card-head { display: flex; align-items: center; gap: 14px; padding: 24px 26px 18px; }\n.card-head h3 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; }\n.card-head .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }\n.date-nav { display: flex; align-items: center; gap: 8px; background: #f6f6fa; border-radius: 11px; padding: 7px 10px; }\n.date-nav button { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }\n.date-nav button:hover { background: #fff; }\n.date-nav span { font-size: 13.5px; font-weight: 700; min-width: 96px; text-align: center; line-height: 1.2; }\n.date-nav svg { width: 16px; height: 16px; }\n.link-violet { color: var(--violet); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }\n.refresh { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }\n.refresh:hover { background: #f6f6fa; color: var(--ink-2); }\n.refresh svg { width: 18px; height: 18px; }\n\n/* schedule table */\n.sched { width: 100%; border-collapse: collapse; }\n.sched thead th {\n  text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: 1px;\n  color: var(--muted-2); text-transform: uppercase; padding: 12px 26px;\n  border-top: 1px solid var(--border-2); border-bottom: 1px solid var(--border-2);\n}\n.sched tbody td { padding: 20px 26px; border-bottom: 1px solid var(--border-2); vertical-align: top; }\n.sched tbody tr:last-child td { border-bottom: none; }\n.sched-time { font-size: 12.5px; font-weight: 800; color: var(--violet); white-space: nowrap; line-height: 1.5; }\n.sched-time small { display: block; color: var(--muted); font-weight: 700; }\n.client b { font-size: 14.5px; font-weight: 700; display: block; }\n.client small { color: var(--muted); font-size: 13px; line-height: 1.4; display: block; margin-top: 3px; }\n.pill {\n  display: inline-block; padding: 6px 13px; border-radius: 999px;\n  font-size: 11px; font-weight: 800; letter-spacing: .5px;\n}\n.pill-green { background: var(--green-bg); color: var(--green); }\n.pill-violet { background: var(--violet-soft); color: var(--violet); }\n.assignee { display: flex; align-items: center; gap: 10px; }\n.mini-avatar {\n  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;\n  font-size: 11px; font-weight: 800; flex: 0 0 30px;\n}\n.assignee span { font-size: 13.5px; font-weight: 600; }\n\n/* recent activity */\n.activity { padding: 6px 26px 22px; display: flex; flex-direction: column; }\n.act-item { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--border-2); }\n.act-item:last-of-type { border-bottom: none; }\n.act-icon { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: 0 0 38px; }\n.act-icon svg { width: 19px; height: 19px; }\n.act-body { line-height: 1.45; }\n.act-body p { margin: 0; font-size: 13.5px; color: var(--ink-2); }\n.act-body p b { color: var(--ink); font-weight: 700; }\n.act-time { display: block; margin-top: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .6px; color: var(--muted-2); text-transform: uppercase; }\n.act-foot { padding: 18px 26px 24px; border-top: 1px solid var(--border-2); display: flex; justify-content: center; }\n\n/* production pipeline */\n.pipeline { padding: 8px 30px 30px; }\n.pipe-track { display: grid; grid-template-columns: repeat(4, 1fr); position: relative; }\n.pipe-track::before {\n  content: ''; position: absolute; top: 28px; left: 12%; right: 12%; height: 2px;\n  background: var(--border); z-index: 0;\n}\n.pipe-step { display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; z-index: 1; }\n.pipe-icon { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 16px; }\n.pipe-icon svg { width: 26px; height: 26px; }\n.pipe-icon.violet { background: var(--violet); color: #fff; box-shadow: 0 8px 18px rgba(91,79,232,.32); }\n.pipe-icon.green { background: var(--green); color: #fff; box-shadow: 0 8px 18px rgba(31,157,90,.28); }\n.pipe-icon.grey { background: #ececf2; color: var(--muted); }\n.pipe-step .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; line-height: 1.3; }\n.pipe-step .num { font-size: 26px; font-weight: 800; margin: 6px 0 12px; letter-spacing: -.5px; }\n.pipe-bar { width: 78%; height: 6px; border-radius: 999px; background: #e          <select class=\"surf-input\" id=\"area-surf-type\">\n                <option>Window (Curtain Path)<\u002Foption>\n                <option>Wall-to-Wall Track<\u002Foption>\n                <option>Bay Window<\u002Foption>\n                <option>Sliding Door<\u002Foption>\n              <\u002Fselect>\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <label class=\"surf-label\">Width (cm)<\u002Flabel>\n            <input class=\"surf-input\" type=\"number\" id=\"area-surf-width\" value=\"240\" min=\"0\">\n          <\u002Fdiv>\n          <div>\n            <label class=\"surf-label\">Height (cm)<\u002Flabel>\n            <input class=\"surf-input\" type=\"number\" id=\"area-surf-height\" value=\"310\" min=\"0\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"am-foot\">\n      <button class=\"cancel\" id=\"area-cancel\">Cancel<\u002Fbutton>\n      <button class=\"add-btn\" id=\"area-add\">Add Area to Quotation<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===================== ADD SURFACE MODAL ===================== -->\n<div class=\"modal-overlay\" id=\"surface-modal\">\n  <div class=\"surf-modal\">\n    <div class=\"surf-head\">\n      <div class=\"sh-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 3 9 5-9 5-9-5 9-5z\"><\u002Fpath><path d=\"m3 14 9 5 9-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div>\n        <h3>Add New Surface<\u002Fh3>\n        <p>Specify measurements for the selected area<\u002Fp>\n      <\u002Fdiv>\n      <button class=\"sh-close\" id=\"surf-close\" aria-label=\"Close\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"surf-body\">\n      <div class=\"step\">\n        <span class=\"step-no\">STEP 01<\u002Fspan>\n        <span class=\"step-title\">Configuration<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"surf-grid\">\n        <div>\n          <label class=\"surf-label\">Surface Type<\u002Flabel>\n          <div class=\"surf-select-wrap\">\n            <select class=\"surf-input\" id=\"surf-type\">\n              <option>Window (Curtain Path)<\u002Foption>\n              <option>Wall-to-Wall Track<\u002Foption>\n              <option>Bay Window<\u002Foption>\n              <option>Sliding Door<\u002Foption>\n            <\u002Fselect>\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <label class=\"surf-label\">Surface Name<\u002Flabel>\n          <input class=\"surf-input\" type=\"text\" id=\"surf-name\" placeholder=\"e.g. Window 01\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"step mt\">\n        <span class=\"step-no\">STEP 02<\u002Fspan>\n        <span class=\"step-title\">Dimensions<\u002Fspan>\n        <button class=\"use-prev\" id=\"surf-use-prev\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 3-6.7L3 8M3 4v4h4\"><\u002Fpath><\u002Fsvg> Use Previous<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"dim-panel\">\n        <div class=\"ruler\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 17 17 3l4 4L7 21z\"><\u002Fpath><path d=\"M8 8l2 2M11 5l2 2M5 11l2 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"dim-grid\">\n          <div>\n            <label class=\"surf-label\">Width (cm)<\u002Flabel>\n            <div class=\"dim-input-wrap\"><input class=\"surf-input\" type=\"number\" id=\"surf-width\" value=\"0.00\" min=\"0\" step=\"0.01\"><span class=\"unit\">CM<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <label class=\"surf-label\">Height (cm)<\u002Flabel>\n            <div class=\"dim-input-wrap\"><input class=\"surf-input\" type=\"number\" id=\"surf-height\" value=\"0.00\" min=\"0\" step=\"0.01\"><span class=\"unit\">CM<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"step mt\">\n        <span class=\"step-no\">STEP 03<\u002Fspan>\n        <span class=\"step-title\">Requirements &amp; Notes<\u002Fspan>\n      <\u002Fdiv>\n      <label class=\"surf-label\">Specific Instructions<\u002Flabel>\n      <textarea class=\"surf-input surf-textarea\" id=\"surf-notes\" placeholder=\"Add surface-level instructions (e.g. 'Check for skirting clearance')\"><\u002Ftextarea>\n    <\u002Fdiv>\n    <div class=\"surf-foot\">\n      <button class=\"cancel\" id=\"surf-cancel\">Cancel<\u002Fbutton>\n      <button class=\"add-btn\" id=\"surf-add\">Add Surface to Area <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===================== CANCEL MODAL ===================== -->\n<div class=\"modal-overlay\" id=\"cancel-modal\">\n  <div class=\"modal\">\n    <div class=\"m-top-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.3 4 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0z\"><\u002Fpath><path d=\"M12 9v4M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n    <h3>Cancel this appointment?<\u002Fh3>\n    <p>This marks <b id=\"cancel-ref\">#APT-1001<\u002Fb> as cancelled. Choose a reason so the team has context — the customer can be notified afterwards.<\u002Fp>\n    <span class=\"modal-label\">Reason<\u002Fspan>\n    <div class=\"reason-chips\" id=\"reason-chips\">\n      <button class=\"reason-chip\">Client rescheduled<\u002Fbutton>\n      <button class=\"reason-chip\">Client unavailable<\u002Fbutton>\n      <button class=\"reason-chip\">Duplicate booking<\u002Fbutton>\n      <button class=\"reason-chip\">Out of service area<\u002Fbutton>\n      <button class=\"reason-chip\">Other<\u002Fbutton>\n    <\u002Fdiv>\n    <span class=\"modal-label\">Details<\u002Fspan>\n    <textarea id=\"cancel-reason\" placeholder=\"Add a short note about why this appointment is being cancelled…\"><\u002Ftextarea>\n    <p class=\"modal-err\" id=\"cancel-err\">Please select or describe a reason before cancelling.<\u002Fp>\n    <div class=\"modal-actions\">\n      <button class=\"btn btn-ghost\" id=\"cancel-keep\">Keep Appointment<\u002Fbutton>\n      <button class=\"btn btn-danger\" id=\"cancel-confirm\">Confirm Cancellation<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n  // ---- placeholder page content ----\n  const META = {\n    production:   ['Production', 'Cutting, sewing and assembly floor management.'],\n    installation: ['Installation', 'Dispatch and track on-site installation jobs.'],\n    inventory:    ['Inventory', 'Textile stock levels, suppliers and reorders.'],\n    customers:    ['Customers', 'Client directory, history and relationships.'],\n    settings:     ['Settings', 'Workspace, team and account preferences.'],\n  };\n  const phIcon = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M3 9h18M9 21V9\"/><\u002Fsvg>';\n  Object.keys(META).forEach(key => {\n    const [title, sub] = META[key];\n    document.getElementById('page-' + key).innerHTML =\n      '<div class=\"page-head\"><div><h2>' + title + '<\u002Fh2><p>' + sub + '<\u002Fp><\u002Fdiv><\u002Fdiv>' +\n      '<div class=\"placeholder\"><div class=\"ph-icon\">' + phIcon + '<\u002Fdiv>' +\n      '<h3>' + title + ' screen<\u002Fh3>' +\n      '<p>This area is wired up and ready. Share the <b>' + title + '<\u002Fb> screen design and it gets built out pixel-faithfully here.<\u002Fp>' +\n      '<div class=\"ph-tag\">Ready for your next screenshot →<\u002Fdiv><\u002Fdiv>';\n  });\n\n  // ---- navigation ----\n  const navItems = document.querySelectorAll('.nav-item');\n  const pages = document.querySelectorAll('.page');\n  function go(page) {\n    const navKey = (page === 'appointment-detail' || page === 'appointment-new') ? 'appointments'\n                 : (page === 'quotation-new' || page === 'quotation-detail') ? 'quotations'\n                 : (page === 'invoice-detail') ? 'invoices' : page;\n    navItems.forEach(n => n.classList.toggle('active', n.dataset.page === navKey));\n    pages.forEach(p => p.classList.toggle('active', p.id === 'page-' + page));\n    document.querySelector('.main').scrollTo({ top: 0 });\n    window.scrollTo({ top: 0 });\n    const fab = document.getElementById('fab');\n    if (fab) fab.classList.toggle('show', page === 'quotations');\n    if (page === 'dashboard' && window.__applyCatBars) window.__applyCatBars();\n    if (page === 'catalog' && window.__renderCatalog) window.__renderCatalog();\n    localStorage.setItem('cm-page', page);\n  }\n  navItems.forEach(n => n.addEventListener('click', () => go(n.dataset.page)));\n  document.querySelector('.btn-new').addEventListener('click', () => go('appointment-new'));\n  document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); go(b.dataset.back); }));\n  // open create form from the appointments header button\n  document.querySelectorAll('#page-appointments .page-head .btn-primary').forEach(b => b.addEventListener('click', () => go('appointment-new')));\n  const confirmApptBtn = document.getElementById('confirm-appt');\n  if (confirmApptBtn) confirmApptBtn.addEventListener('click', () => go('appointments'));\n\n  // ---- open appointment detail from a table row ----\n  const STATUS_CLASS = { SCHEDULED: 'st-scheduled', 'IN PROGRESS': 'st-progress', COMPLETED: 'st-completed', CANCELLED: 'st-cancelled' };\n  let currentApt = '#APT-1001';\n  const currentCustomer = { name: 'Fatima Al Hashimi', phone: '+971 50 123 4567', addr: 'Al Marsa St, Dubai Marina', date: 'Tuesday, Oct 24 · 09:30 AM' };\n  let quoteReturnTo = 'appointment-detail';\n  const cancelData = { '#APT-0998': { reason: 'Client requested to reschedule to next month.', when: 'Oct 21, 2024 · 11:40 AM' } };\n\n  const banner = document.getElementById('cancel-banner');\n  const adStatus = document.getElementById('ad-status');\n\n  const SOURCE_ICON = {\n    'WhatsApp': '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.5 8.5 0 0 1-12.5 7.5L3 21l2-5.5A8.5 8.5 0 1 1 21 11.5z\"/><\u002Fsvg>',\n    'Phone Call': '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.7 2z\"/><\u002Fsvg>',\n    'Email': '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2.5\"/><path d=\"m2 7 10 6 10-6\"/><\u002Fsvg>',\n    'Walk-in': '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 4a1.5 1.5 0 1 0 0-.01M9 9l3-1 2 3 3 1M8 21l2-6 3-2M10 15l-2 2\"/><\u002Fsvg>',\n    'Website': '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z\"/><\u002Fsvg>',\n    'Referral': '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3.2\"/><path d=\"M3 20a6 6 0 0 1 12 0M16.5 5.2a3.2 3.2 0 0 1 0 5.6M21 20a6 6 0 0 0-4-5.6\"/><\u002Fsvg>'\n  };\n\n  function setApptStatus(statusTxt) {\n    const cls = STATUS_CLASS[statusTxt] || 'st-scheduled';\n    adStatus.textContent = statusTxt;\n    adStatus.className = 'status status-lg ' + cls;\n    const sa = document.getElementById('ad-sa-status');\n    if (sa) { sa.textContent = statusTxt; sa.className = 'status ' + cls; }\n    // mark current option in the status menu\n    document.querySelectorAll('#ad-status-menu .status-opt').forEach(o => o.classList.toggle('current', o.dataset.status === statusTxt));\n    renderCancelState();\n  }\n\n  function renderCancelState() {\n    const rec = cancelData[currentApt];\n    const cancelled = adStatus.textContent.trim() === 'CANCELLED';\n    if (cancelled && rec) {\n      document.getElementById('cb-reason').textContent = rec.reason;\n      document.getElementById('cb-meta').textContent = 'Cancelled by Basheer · ' + rec.when;\n      banner.classList.add('show');\n    } else {\n      banner.classList.remove('show');\n    }\n  }\n\n  document.querySelectorAll('#page-appointments .data-table tbody tr').forEach(row => {\n    function captureCustomer() {\n      currentApt = row.querySelector('.cell-id').textContent.trim();\n      currentCustomer.name = row.querySelector('.cell-name').textContent.trim();\n      currentCustomer.phone = row.children[2].textContent.trim();\n      currentCustomer.addr = row.dataset.address || '';\n      currentCustomer.email = row.dataset.email || '';\n      currentCustomer.source = row.dataset.source || 'WhatsApp';\n      currentCustomer.building = row.dataset.building || '';\n      currentCustomer.room = row.dataset.room || '';\n      const bk = row.querySelector('.cell-booking');\n      currentCustomer.bookDate = bk ? bk.querySelector('b').textContent.trim() : '';\n      currentCustomer.bookTime = bk ? bk.querySelector('small').textContent.trim() : '';\n      const asg = row.querySelector('.cell-assignee');\n      currentCustomer.assignee = asg ? asg.querySelector('span:last-child').textContent.trim() : '';\n      currentCustomer.assigneeInit = asg ? asg.querySelector('.mini-avatar').textContent.trim() : '';\n      currentCustomer.assigneeTint = asg ? (asg.querySelector('.mini-avatar').className.match(/tint-\\w+/) || ['tint-violet'])[0] : 'tint-violet';\n    }\n    row.addEventListener('click', () => {\n      captureCustomer();\n      const id = currentApt, name = currentCustomer.name, addr = currentCustomer.addr;\n      const statusTxt = row.querySelector('.status').textContent.trim();\n      document.getElementById('ad-title').textContent = 'Appointment ' + id;\n      document.getElementById('ad-crumb').textContent = id;\n      // customer block\n      document.querySelector('#page-appointment-detail .profile h4').textContent = name;\n      document.querySelector('#page-appointment-detail .big-avatar').textContent = name.split(' ').map(w => w[0]).slice(0, 2).join('');\n      const contactRows = document.querySelectorAll('#page-appointment-detail .contact-list .contact-row .c-val');\n      if (contactRows[0]) contactRows[0].textContent = currentCustomer.phone;\n      if (contactRows[1]) contactRows[1].textContent = currentCustomer.email;\n      if (contactRows[2]) contactRows[2].textContent = addr;\n      // booking date/time facts + slot summary\n      const bd = document.getElementById('ad-bookdate'); if (bd) bd.textContent = currentCustomer.bookDate;\n      const bt = document.getElementById('ad-booktime'); if (bt) bt.childNodes[0].nodeValue = currentCustomer.bookTime;\n      const slot = document.getElementById('ad-sa-slot'); if (slot) slot.textContent = currentCustomer.bookDate + ' · ' + currentCustomer.bookTime;\n      // source\n      const srcIcon = SOURCE_ICON[currentCustomer.source] || SOURCE_ICON['WhatsApp'];\n      document.getElementById('ad-source-name').textContent = currentCustomer.source;\n      document.getElementById('ad-source-ic').innerHTML = srcIcon;\n      document.getElementById('ad-source-fact').textContent = currentCustomer.source;\n      // location card\n      document.getElementById('ad-building').textContent = currentCustomer.building || '—';\n      document.getElementById('ad-room').textContent = currentCustomer.room || '—';\n      document.getElementById('ad-fulladdr').textContent = addr;\n      // assignee (SA card)\n      const an = document.getElementById('ad-assignee-name');\n      if (an) an.textContent = currentCustomer.assignee;\n      setApptStatus(statusTxt);\n      go('appointment-detail');\n    });\n    // quick “Create Quote” action on the row\n    const quoteBtn = row.querySelector('.row-quote');\n    if (quoteBtn) quoteBtn.addEventListener('click', e => {\n      e.stopPropagation();\n      captureCustomer();\n      openQuote('appointments');\n    });\n  });\n\n  // ---- create-quotation builder ----\n  const money = n => 'AED ' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n  const FULLNESS = 1.68; // fabric fullness factor\n\n  // B2C locks prices to the catalog; B2B lets the user override the price per unit while quoting\n  function currentQuoteType() {\n    const b = document.querySelector('#quote-type .on span:last-child');\n    return (b && /b2b/i.test(b.textContent)) ? 'B2B' : 'B2C';\n  }\n  function applyQuoteType() {\n    const isB2B = currentQuoteType() === 'B2B';\n    const page = document.getElementById('page-quotation-new');\n    if (page) { page.classList.toggle('qt-b2b', isB2B); page.classList.toggle('qt-b2c', !isB2B); }\n    document.querySelectorAll('#page-quotation-new .qt-price').forEach(inp => {\n      inp.readOnly = !isB2B;\n      inp.title = isB2B ? 'Editable — set a custom B2B price' : 'Locked to the catalog price (B2C)';\n    });\n    document.querySelectorAll('#page-quotation-new .price-mode-hint').forEach(h => {\n      h.textContent = isB2B ? '· editable' : '· from catalog';\n    });\n  }\n  // show/hide motorization & charges in the quotation to match the work type's enabled features\n  function applyWorkFeatures() {\n    const feat = workFeat(currentWorkType());\n    document.querySelectorAll('#page-quotation-new .surface-card').forEach(s => {\n      const panel = s.querySelector('.motor-panel');\n      updateItemImage(s);\n      const drawBlock = s.querySelector('.draw-block');\n      if (drawBlock) drawBlock.style.display = feat.draw ? '' : 'none';\n      const pelmetPanel = s.querySelector('.pelmet-panel');\n      if (pelmetPanel) pelmetPanel.style.display = feat.pelmet ? '' : 'none';\n      if (!panel) return;\n      panel.style.display = (feat.motor || feat.charges) ? '' : 'none';\n      panel.classList.toggle('nm', !feat.motor);\n      panel.classList.toggle('nc', !feat.charges);\n      const mt = s.querySelector('.motor-type');\n      if (mt) {\n        const manualBtn = mt.querySelector('.mt-manual');\n        const motorBtn = mt.querySelector('.mt-motorized');\n        const onBtn = mt.querySelector('.on');\n        if (onBtn === manualBtn && !feat.charges && feat.motor) { manualBtn.classList.remove('on'); motorBtn.classList.add('on'); }\n        else if (onBtn === motorBtn && !feat.motor && feat.charges) { motorBtn.classList.remove('on'); manualBtn.classList.add('on'); }\n      }\n    });\n  }\n  function recalcQuote() {\n  null\n    };\n    q.invoiceId = id;\n    return id;\n  }\n\n  function paidOf(inv) { const q = quotations[inv.quoteId]; return q ? (q.paid || 0) : 0; }\n  function invStatus(inv) {\n    const paid = paidOf(inv);\n    if (paid >= inv.total - 0.01) return 'PAID';\n    if (paid > 0.01) return 'PARTIAL';\n    if (!inv.sentAt) return 'UNPAID';\n    if (inv.dueTime && Date.now() > inv.dueTime) return 'OVERDUE';\n    return 'SENT';\n  }\n\n  function renderInvoiceRows() {\n    const tb = document.getElementById('inv-rows');\n    const list = Object.values(invoices);\n    tb.innerHTML = '';\n    let totalSum = 0, paidSum = 0, dueSum = 0, sentCount = 0;\n    list.forEach(inv => {\n      const paid = paidOf(inv);\n      const bal = Math.max(0, inv.total - paid);\n      const st = invStatus(inv);\n      totalSum += inv.total; paidSum += paid; dueSum += bal;\n      if (inv.sentAt) sentCount++;\n      const tr = document.createElement('tr');\n      tr.innerHTML =\n        '<td class=\"cell-id\">' + inv.id + '<\u002Ftd>' +\n        '<td><div class=\"q-name\"><b>' + inv.name + '<\u002Fb><small>' + inv.sub + '<\u002Fsmall><\u002Fdiv><\u002Ftd>' +\n        '<td class=\"q-muted\" style=\"color:var(--violet);font-weight:700\">#' + inv.quoteId + '<\u002Ftd>' +\n        '<td class=\"cell-top\">' + inv.issued + '<\u002Ftd>' +\n        '<td class=\"q-total\">' + money(inv.total) + '<\u002Ftd>';\n      tr.addEventListener('click', () => openInvoiceDetail(inv.id));\n      tb.appendChild(tr);\n    });\n    document.getElementById('inv-empty').classList.toggle('show', list.length === 0);\n    document.getElementById('inv-stat-total').textContent = money(totalSum);\n    document.getElementById('inv-stat-paid').textContent = money(paidSum);\n    document.getElementById('inv-stat-due').textContent = money(dueSum);\n    document.getElementById('inv-stat-sent').textContent = sentCount;\n    document.getElementById('inv-showing').textContent = list.length\n      ? ('Showing ' + list.length + ' invoice' + (list.length > 1 ? 's' : ''))\n      : 'No invoices yet';\n  }\n  window.__refreshInvoices = renderInvoiceRows;\n\n  function renderInvoiceItems(items) {\n    const tb = document.getElementById('inv-items');\n    tb.innerHTML = '';\n    items.forEach(area => {\n      const ar = document.createElement('tr');\n      ar.className = 'item-area-row';\n      ar.innerHTML = '<td colspan=\"2\">' + area.area + (area.type ? '<span class=\"ia-type\">' + area.type + '<\u002Fspan>' : '') + '<\u002Ftd>';\n      tb.appendChild(ar);\n      area.lines.forEach(li => {\n        const tr = document.createElement('tr');\n        tr.innerHTML = '<td>' +\n          (li.spec && li.spec.surfaceName ? '<div class=\"it-surface-name\">' + li.spec.surfaceName + '<\u002Fdiv>' : '') +\n          '<div class=\"it-name\">' + li.name + '<\u002Fdiv>' +\n          (li.detail ? '<div class=\"it-detail\">' + li.detail + '<\u002Fdiv>' : '') +\n          specHTML(li.spec) + '<\u002Ftd>' +\n          '<td class=\"it-amount\">' + money(li.amount) + '<\u002Ftd>';\n        tb.appendChild(tr);\n      });\n    });\n  }\n\n  let currentInvoice = null;\n  function renderInvoiceDetail(inv) {\n    const paid = paidOf(inv);\n    const bal = Math.max(0, inv.total - paid);\n    const st = invStatus(inv);\n    document.getElementById('inv-title').textContent = 'Invoice #' + inv.id;\n    document.getElementById('inv-crumb').textContent = '#' + inv.id;\n    const badge = document.getElementById('inv-status');\n    badge.textContent = st;\n    badge.className = 'status status-lg ' + (INV_STATUS_CLASS[st] || 'st-unpaid');\n    document.getElementById('inv-customer').textContent = inv.name;\n    document.getElementById('inv-quote').textContent = '#' + inv.quoteId;\n    document.getElementById('inv-terms').textContent = inv.terms;\n    document.getElementById('inv-view-quote-label').textContent = 'View Quotation';\n    renderInvoiceItems(inv.items);\n    const sub = inv.total / 1.05, vat = inv.total - sub;\n    document.getElementById('inv-subtotal').textContent = money(sub);\n    document.getElementById('inv-vat').textContent = money(vat);\n    document.getElementById('inv-total').textContent = money(inv.total);\n    document.getElementById('inv-link').textContent = inv.link;\n    const initials = inv.name.split(' ').map(w => w[0]).slice(0, 2).join('');\n    document.getElementById('inv-cust-avatar').textContent = initials;\n    document.getElementById('inv-cust-name').textContent = inv.name;\n    document.getElementById('inv-cust-sub').textContent = inv.sub;\n    document.getElementById('inv-cust-phone').textContent = inv.phone;\n    document.getElementById('inv-cust-email').textContent = inv.email;\n    const banner = document.getElementById('inv-banner');\n    document.getElementById('inv-send-label').textContent = inv.sentAt ? 'Resend for Payment' : 'Send for Payment';\n    if (inv.sentAt) {\n      document.getElementById('inv-banner-title').textContent = 'Invoice sent via ' + inv.sentVia;\n      document.getElementById('inv-banner-text').textContent = inv.name + ' has been sent a payment request with the secure link. Track responses or record payment here.';\n      banner.classList.add('show');\n    } else {\n      banner.classList.remove('show');\n    }\n  }\n  function openInvoiceDetail(id) {\n    const inv = invoices[id];\n    if (!inv) return;\n    currentInvoice = inv;\n    renderInvoiceDetail(inv);\n    go('invoice-detail');\n  }\n\n  function updateQuoteInvoiceState(q) {\n    const invBanner = document.getElementById('qd-invoice-banner');\n    const paidBtn = document.getElementById('qd-paid-invoice');\n    const paidLabel = document.getElementById('qd-paid-label');\n    const sendBtn = document.getElementById('qd-send-open-2');\n    const hint = document.getElementById('qd-step-hint');\n    const hintText = document.getElementById('qd-step-text');\n    const acceptDot = document.getElementById('qd-tl-accept-dot');\n    const acceptTxt = document.getElementById('qd-tl-accept');\n    const invDot = document.getElementById('qd-tl-invoice-dot');\n    const invTxt = document.getElementById('qd-tl-invoice');\n    if (!q) return;\n    const hasInvoice = q.invoiceId && invoices[q.invoiceId];\n    const isAccepted = q.status === 'ACCEPTED';\n    // timeline: accepted\n    acceptDot.className = 'tl-dot' + (isAccepted || hasInvoice ? ' green' : '');\n    acceptTxt.textContent = (isAccepted || hasInvoice) ? (q.acceptedAt || 'Confirmed by customer') : '—';\n\n    if (hasInvoice) {\n      const inv = invoices[q.invoiceId];\n      // timeline: invoice\n      invDot.className = 'tl-dot green';\n      invTxt.textContent = (inv.sentAt ? 'Sent ' + (inv.sentVia ? 'via ' + inv.sentVia + ' · ' : '') : 'Created ') + inv.issued;\n      // button -> view\n      paidBtn.disabled = false;\n      paidLabel.textContent = 'View Paid Invoice';\n      sendBtn.style.display = 'none';\n      hint.className = 'qd-step-hint done-state';\n      hintText.textContent = 'Paid invoice ' + inv.id + ' created and sent to the customer. Workflow complete.';\n      // banner\n      document.getElementById('qd-invoice-banner-title').textContent = 'Paid invoice ' + inv.id + ' issued';\n      document.getElementById('qd-invoice-banner-text').textContent = 'A fully-paid invoice was created from this quotation' +\n        (inv.sentAt ? ' and sent to the customer.' : '.');\n      invBanner.classList.add('show');\n    } else {\n      invDot.className = 'tl-dot';\n      invTxt.textContent = '—';\n      sendBtn.style.display = '';\n      paidLabel.textContent = 'Create Paid Invoice';\n      invBanner.classList.remove('show');\n      if (isAccepted) {\n        paidBtn.disabled = false;\n        hint.className = 'qd-step-hint ready';\n        hintText.textContent = 'Quotation accepted — create the paid invoice (full payment) and send it to the customer.';\n      } else {\n        paidBtn.disabled = true;\n        hint.className = 'qd-step-hint';\n        hintText.textContent = q.sentAt\n          ? 'Quotation sent. Mark it Accepted once the customer confirms to enable invoicing.'\n          : 'Send the quotation PDF to the customer and await acceptance before invoicing.';\n      }\n    }\n  }\n  window.__updateQuoteInvoiceState = updateQuoteInvoiceState;\n\n  window.__afterPayment = function() {\n    renderInvoiceRows();\n    if (currentInvoice && document.getElementById('page-invoice-detail').classList.contains('active')) {\n      renderInvoiceDetail(currentInvoice);\n    }\n  };\n\n  // ---- view existing invoice from banner ----\n  document.getElementById('qd-view-invoice').addEventListener('click', () => {\n    if (currentQuote && currentQuote.invoiceId) openInvoiceDetail(currentQuote.invoiceId);\n  });\n  // ---- create a fully-paid invoice in one step (only after acceptance) ----\n  document.getElementById('qd-paid-invoice').addEventListener('click', () => {\n    if (!currentQuote) return;\n    // if invoice already exists, just open it\n    if (currentQuote.invoiceId && invoices[currentQuote.invoiceId]) { openInvoiceDetail(currentQuote.invoiceId); return; }\n    if (currentQuote.status !== 'ACCEPTED') return; // gated\n    const id = createInvoice(currentQuote.id);\n    const inv = invoices[id];\n    // mark sent + record full payment\n    if (inv && !inv.sentAt) { inv.sentAt = fmtDate(new Date()); inv.sentVia = 'Direct'; }\n    const due = Math.max(0, currentQuote.total - (currentQuote.paid || 0));\n    if (due > 0.01) {\n      recordPayment(currentQuote.id, 'Cash', 'PAID-IN-FULL', due,\n        new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),\n        'Full payment on invoice creation');\n    }\n    renderInvoiceRows();\n    updateQuoteInvoiceState(currentQuote);\n    openInvoiceDetail(id);\n  });\n  document.getElementById('inv-view-quote').addEventListener('click', () => {\n    if (currentInvoice) openQuotationDetail(currentInvoice.quoteId);\n  });\n  document.getElementById('inv-pay-open').addEventListener('click', () => openPaymentModal(currentInvoice ? currentInvoice.quoteId : null));\n\n  // ---- payment-link copy ----\n  document.getElementById('inv-link-copy').addEventListener('click', () => {\n    const url = 'https://' + document.getElementById('inv-link').textContent;\n    const btn = document.getElementById('inv-link-copy');\n    const span = btn.querySelector('span');\n    const done = () => { btn.classList.add('copied'); span.textContent = 'Copied'; setTimeout(() => { btn.classList.remove('copied'); span.textContent = 'Copy'; }, 1600); };\n    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done).catch(done);\n    else done();\n  });\n\n  // ---- send invoice for payment modal ----\n  const invSendModal = document.getElementById('inv-send-modal');\n  function invMessage(inv) {\n    const bal = Math.max(0, inv.total - paidOf(inv));\n    const first = inv.name.split(' ')[0];\n    return 'Hi ' + first + ', your invoice ' + inv.id + ' from CurtainMaster for ' + money(bal) +\n      ' is ready. Due by ' + inv.due + '. Pay securely here: ';\n  }\n  function syncInvSendChannel(channel) {\n    document.getElementById('inv-send-subject-field').style.display = channel === 'Email' ? '' : 'none';\n    document.getElementById('inv-preview-label').textContent =\n      channel === 'WhatsApp' ? 'WhatsApp Preview' : channel === 'SMS' ? 'SMS Preview' : 'Email Preview';\n    document.getElementById('inv-send-btn-label').textContent = 'Send via ' + channel;\n    document.getElementById('inv-wa-text').textContent = document.getElementById('inv-send-message').value + ' ';\n    document.getElementById('inv-wa-time').textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });\n  }\n  function openInvSendModal() {\n    if (!currentInvoice) return;\n    const inv = currentInvoice;\n    const bal = Math.max(0, inv.total - paidOf(inv));\n    document.getElementById('inv-send-sub').innerHTML = 'Request payment of <b>' + money(bal) + '<\u002Fb> for <b>#' + inv.id + '<\u002Fb>';\n    document.getElementById('inv-send-avatar').textContent = inv.name.split(' ').map(w => w[0]).slice(0, 2).join('');\n    document.getElementById('inv-send-name').textContent = inv.name;\n    document.getElementById('inv-send-subject').value = 'Invoice #' + inv.id + ' from CurtainMaster';\n    const chans = document.querySelectorAll('#inv-send-channels .channel-btn');\n    chans.forEach((c, i) => c.classList.toggle('on', i === 0));\n    chans[0].dataset.to = inv.phone; chans[1].dataset.to = inv.email; chans[2].dataset.to = inv.phone;\n    document.getElementById('inv-send-to').textContent = inv.phone;\n    document.getElementById('inv-send-message').value = invMessage(inv);\n    document.getElementById('inv-wa-link').textContent = inv.link;\n    syncInvSendChannel('WhatsApp');\n    invSendModal.classList.add('show');\n  }\n  function closeInvSendModal() { invSendModal.classList.remove('show'); }\n  document.getElementById('inv-send-open').addEventListener('click', openInvSendModal);\n  document.getElementById('inv-send-open-2').addEventListener('click', openInvSendModal);\n  document.getElementById('inv-send-close').addEventListener('click', closeInvSendModal);\n  document.getElementById('inv-send-cancel').addEventListener('click', closeInvSendModal);\n  invSendModal.addEventListener('click', e => { if (e.target === invSendModal) closeInvSendModal(); });\n  document.getElementById('inv-send-message').addEventListener('input', () => {\n    document.getElementById('inv-wa-text').textContent = document.getElementById('inv-send-message').value + ' ';\n  });\n  document.getElementById('inv-send-channels').addEventListener('click', e => {\n    const btn = e.target.closest('.channel-btn');\n    if (!btn) return;\n    document.querySelectorAll('#inv-send-channels .channel-btn').forEach(c => c.classList.remove('on'));\n    btn.classList.add('on');\n    document.getElementById('inv-send-to').textContent = btn.dataset.to;\n    syncInvSendChannel(btn.dataset.channel);\n  });\n  document.getElementById('inv-send-confirm').addEventListener('click', () => {\n    if (!currentInvoice) return;\n    const channel = document.querySelector('#inv-send-channels .channel-btn.on').dataset.channel;\n    currentInvoice.sentAt = fmtDate(new Date()) + ' · ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });\n    currentInvoice.sentVia = channel;\n    closeInvSendModal();\n    renderInvoiceRows();\n    renderInvoiceDetail(currentInvoice);\n  });\n\n  // seed a couple of invoices so the module is populated on first load\n  (function seedInvoices() {\n    ['QT-90214', 'QT-90217'].forEach(qid => {\n      if (quotations[qid]) {\n        const id = createInvoice(qid);\n        if (id && invoices[id]) { invoices[id].sentAt = 'Oct 24, 2024 · 03:10 PM'; invoices[id].sentVia = 'WhatsApp'; }\n      }\n    });\n    renderInvoiceRows();\n  })();\n\n  // ---- cancel-with-reason modal ----\n  const modal = document.getElementById('cancel-modal');\n  const reasonChips = document.getElementById('reason-chips');\n  const reasonText = document.getElementById('cancel-reason');\n  const cancelErr = document.getElementById('cancel-err');\n  function openModal() {\n    document.getElementById('cancel-ref').textContent = currentApt;\n    reasonChips.querySelectorAll('.reason-chip').forEach(c => c.classList.remove('on'));\n    reasonText.value = ''; reasonText.classList.remove('err'); cancelErr.classList.remove('show');\n    modal.classList.add('show');\n  }\n  function closeModal() { modal.classList.remove('show'); }\n  document.getElementById('cancel-keep').addEventListener('click', closeModal);\n  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });\n  reasonChips.querySelectorAll('.reason-chip').forEach(c => c.addEventListener('click', () => {\n    reasonChips.querySelectorAll('.reason-chip').forEach(x => x.classList.remove('on'));\n    c.classList.add('on');\n    if (c.textContent !== 'Other') reasonText.value = c.textContent;\n    reasonText.classList.remove('err'); cancelErr.classList.remove('show');\n  }));\n  document.getElementById('cancel-confirm').addEventListener('click', () => {\n    const chip = reasonChips.querySelector('.reason-chip.on');\n    const note = reasonText.value.trim();\n    if (!chip && !note) { reasonText.classList.add('err'); cancelErr.classList.add('show'); return; }\n    const reason = note || (chip ? chip.textContent : '');\n    const when = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +\n      ' · ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });\n    cancelData[currentApt] = { reason, when };\n    setApptStatus('CANCELLED');\n    syncApptRow();\n    addTimeline('Appointment cancelled', reason, 'cancel');\n    closeModal();\n  });\n\n  // ---- sync the appointments table row with current detail state ----\n  function findApptRow() {\n    return [...document.querySelectorAll('#page-appointments .data-table tbody tr')]\n      .find(r => r.querySelector('.cell-id').textContent.trim() === currentApt);\n  }\n  function syncApptRow() {\n    const row = findApptRow(); if (!row) return;\n    const st = row.querySelector('.status');\n    const txt = adStatus.textContent.trim();\n    st.textContent = txt;\n    st.className = 'status ' + (STATUS_CLASS[txt] || 'st-scheduled');\n    // booking cell\n    const bk = row.querySelector('.cell-booking');\n    if (bk && currentCustomer.bookDate) { bk.querySelector('b').textContent = currentCustomer.bookDate; bk.querySelector('small').textContent = currentCustomer.bookTime; }\n    // assignee cell\n    const asg = row.querySelector('.cell-assignee');\n    if (asg && currentCustomer.assignee) {\n      asg.querySelector('span:last-child').textContent = currentCustomer.assignee;\n      const av = asg.querySelector('.mini-avatar');\n      av.text t channel = document.querySelector('#loc-channels .channel-btn.on').dataset.channel;\n    locSendBtn.disabled = true;\n    locSendBtn.innerHTML = 'Request sent via ' + channel;\n    document.getElementById('loc-await').classList.add('show');\n    document.getElementById('loc-recv').classList.remove('show');\n    // simulate the customer tapping the link and sharing their pin\n    setTimeout(() => {\n      document.getElementById('loc-await').classList.remove('show');\n      document.getElementById('loc-recv').classList.add('show');\n      locReceived = true;\n      locSendBtn.disabled = false;\n      locSendBtn.innerHTML = 'Use Customer\\u2019s Location <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 12 2 2 4-4\"/><\u002Fsvg>';\n    }, 2200);\n  });\n\n  // ---- map pane: draggable pin updates coordinates ----\n  const mapBox = document.getElementById('loc-map');\n  const mapPin = document.getElementById('loc-map-pin');\n  const mapCoords = document.getElementById('loc-map-coords');\n  let dragging = false;\n  function pinToCoords(xPct, yPct) {\n    // fake but plausible Dubai Marina coordinates from pin position\n    const lat = (25.045 + (1 - yPct) * 0.06).toFixed(4);\n    const lng = (55.130 + xPct * 0.03).toFixed(4);\n    mapCoords.textContent = lat + ', ' + lng;\n    document.getElementById('loc-detected').classList.add('show');\n    document.getElementById('loc-detected-addr').textContent = 'Marina Heights Tower, Dubai Marina — ' + lat + ', ' + lng;\n    mapPin.dataset.coords = lat + ', ' + lng;\n  }\n  function movePin(clientX, clientY) {\n    const r = mapBox.getBoundingClientRect();\n    let x = Math.min(Math.max(clientX - r.left, 12), r.width - 12);\n    let y = Math.min(Math.max(clientY - r.top, 20), r.height - 6);\n    mapPin.style.left = x + 'px';\n    mapPin.style.top = y + 'px';\n    pinToCoords(x / r.width, y / r.height);\n  }\n  mapPin.addEventListe -svg');\n    const tip = document.getElementById('rev-tip');\n    const wrap = document.getElementById('revenue-wrap');\n    const W = 760, H = 240, padL = 44, padR = 12, padT = 16, padB = 30;\n    const NS = 'http://www.w3.org/2000/svg';\n    function el(tag, attrs) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; }\n\n    function drawRevenue(range) {\n      const d = REV[range];\n      const max = 160, min = 50;\n      const n = d.labels.length;\n      const x = i => padL + (W - padL - padR) * (i / (n - 1));\n      const y = v => padT + (H - padT - padB) * (1 - (v - min) / (max - min));\n      svg.innerHTML = '';\n      // gridlines + y axis labels\n      const g = el('g', { class: 'rev-grid' });\n      [50, 80, 110, 140].forEach(v => {\n        g.appendChild(el('line', { x1: padL, y1: y(v), x2: W - padR, y2: y(v) }));\n        const t = el('text', { x: padL - 10, y: y(v) + 4, 'text-anchor': 'end', class: 'rev-axis' });\n        t.textContent = v + 'k';\n        g.appendChild(t);\n      });\n      svg.appendChild(g);\n      // x labels\n      d.labels.forEach((lb, i) => {\n        const t = el('text', { x: x(i), y: H - 8, 'text-anchor': 'middle', class: 'rev-axis' });\n        t.textContent = lb;\n        svg.appendChild(t);\n      });\n      // target line (dashed)\n      let tp = '';\n      d.tgt.forEach((v, i) => { tp += (i ? 'L' : 'M') + x(i) + ' ' + y(v) + ' '; });\n      svg.appendChild(el('path', { d: tp, fill: 'none', stroke: '#cfcaf5', 'stroke-width': 2, 'stroke-dasharray': '5 5', 'stroke-linecap': 'round' }));\n      // revenue area\n      let lp = '';\n      d.rev.forEach((v, i) => { lp += (i ? 'L' : 'M') + x(i) + ' ' + y(v) + ' '; });\n      const areaPath = lp + 'L' + x(n - 1) + ' ' + (H - padB) + ' L' + x(0) + ' ' + (H - padB) + ' Z';\n      const grad = el('linearGradient', { id: 'revGrad', x1: 0, y1: 0, x2: 0, y2: 1 });\n      grad.appendChild(el('stop', { offset: '0%', 'stop-color': '#5b4fe8', 'stop-opacity': '.22' }));\n      grad.appendChild(el('stop', { offset: '100%', 'stop-color': '#5b4fe8', 'stop-opacity': '0' }));\n      const defs = el('defs', {}); defs.appendChild(grad); svg.appendChild(defs);\n      svg.appendChild(el('path', { d: areaPath, fill: 'url(#revGrad)' }));\n      svg.appendChild(el('path', { d: lp, fill: 'none', stroke: 'var(--violet)', 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));\n      // dots + hover hit areas\n      d.rev.forEach((v, i) => {\n        svg.appendChild(el('circle', { class: 'rev-dot', cx: x(i), cy: y(v), r: 4 }));\n        const hit = el('rect', { x: x(i) - (W / n) / 2, y: padT, width: W / n, height: H - padT - padB, fill: 'transparent', style: 'cursor:pointer' });\n        hit.addEventListener('mouseenter', () => {\n          const rect = wrap.getBoundingClientRect();\n          tip.style.left = (x(i) / W * rect.width) + 'px';\n          tip.style.top = (y(v) / H * rect.height) + 'px';\n          tip.innerHTML = '<small>' + d.labels[i] + '<\u002Fsmall>AED ' + v + ',000';\n          tip.style.opacity = '1';\n        });\n        hit.addEventListener('mouseleave', () => { tip.style.opacity = '0'; });\n        svg.appendChild(hit);\n      });\n    }\n    drawRevenue('6M');\n    document.getElementById('rev-seg').addEventListener('click', e => {\n      const b = e.target.closest('button'); if (!b) return;\n      document.querySelectorAll('#rev-seg button').forEach(x => x.classList.remove('on'));\n      b.classList.add('on');\n      drawRevenue(b.dataset.range);\n    });\n\n    // ----- Quotation status donut -----\n    const donutData = [\n      { name: 'Accepted', val: 1078, color: '#1f9d5a' },\n      { name: 'Pending', val: 154, color: '#5b4fe8' },\n      { name: 'Cancelled', val: 52, color: '#e5484d' }\n    ];\n    const dsvg = document.getElementById('donut-svg');\n    const total = donutData.reduce((s, d) => s + d.val, 0);\n    const R = 46, C = 2 * Math.PI * R;\n    let offset = 0;\n    dsvg.appendChild(el('circle', { cx: 60, cy: 60, r: R, fill: 'none', stroke: '#f1f1f6', 'stroke-width': 16 }));\n    donutData.forEach(d => {\n      const frac = d.val / total;\n      const seg = el('circle', { cx: 60, cy: 60, r: R, fill: 'none', stroke: d.color, 'stroke-width': 16,\n        'stroke-dasharray': (frac * C) + ' ' + C, 'stroke-dashoffset': -offset, 'stroke-linecap': 'butt' });\n      dsvg.appendChild(seg);\n      offset += frac * C;\n    });\n    const dleg = document.getElementById('donut-legend');\n    donutData.forEach(d => {\n      const pct = Math.round(d.val / total * 100);\n      const row = document.createElement('div');\n      row.className = 'dl';\n      row.innerHTML = '<i style=\"background:' + d.color + '\"><\u002Fi><span class=\"dl-name\">' + d.name + '<\u002Fspan><span class=\"dl-val\">' + pct + '%<\u002Fspan>';\n      dleg.appendChild(row);\n    });\n\n    // ----- Sales by category bars -----\n    const cats = [\n      { name: 'Curtains', val: 420 }, { name: 'Sheers', val: 310 }, { name: 'Blinds', val: 268 },\n      { name: 'Motors', val: 196 }, { name: 'Sofa', val: 142 }, { name: 'Balloon', val: 88 }\n    ];\n    const maxCat = Math.max(...cats.map(c => c.val));\n    const cb = document.getElementById('catbars');\n    cats.forEach(c => {\n      const col = document.createElement('div');\n      col.className = 'catbar';\n      col.innerHTML = '<div class=\"cb-track\"><div class=\"cb-fill\" data-h=\"' + (c.val / maxCat * 100) + '\"><span class=\"cb-num\">' + c.val + '<\u002Fspan><\u002Fdiv><\u002Fdiv>' +\n        '<div class=\"cb-label\">' + c.name + '<\u002Fdiv>';\n      cb.appendChild(col);\n    });\n    window.__applyCatBars = function() {\n      document.querySelectorAll('#catbars .cb-fill').forEach(f => { f.style.height = f.dataset.h + '%'; });\n    };\n    window.__applyCatBars();\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
